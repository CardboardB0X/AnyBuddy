<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script>
        (function(){if(localStorage.getItem('anybuddy-theme')==='dark')document.documentElement.setAttribute('data-theme','dark');})();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;700&family=Google+Sans+Code:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="theme.css?v=33">
    <link rel="stylesheet" href="signup.css?v=30">
    <link rel="stylesheet" href="ajax_ui.css?v=30">
    <title>Sign Up</title>
</head>
<body>
    <!-- Background Blobs -->
    <div class="blob-container">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
    </div>

    <!--NAVBAR-->
    <div class="navbar">
        <a href="homepage.html" class="navlogo">
            <img
            src="images/AnyBuddy LOGO.png" 
            alt="AnyBuddy Logo"
            width=40px
            height=40px>
            <h2>AnyBuddy</h2>
        </a>
        <div class="navlinks">
            <a href="marketplace.html">Marketplace</a>
            <a href="about.html">About</a>
            <a href="login.html">Login</a>
            <a href="signup.html">Sign up</a>
            <a class="bab-btn" href="become-buddy.html">Become a Buddy</a>
            <button type="button" class="theme-toggle" id="themeToggle" aria-label="Toggle dark mode">
                <img class="theme-toggle-icon" src="images/light-mode.png" alt="Switch to dark mode">
            </button>
            <a href="login.html" class="nav-user-link">
                <img class="nav-user-icon" src="images/user-light.png" alt="User">
            </a>
        </div>
    </div>

    <main class="main">
        <div class="signup-card">
            <h1>Create your account</h1>
            <form class="signup-form" action="#" method="post">
                <div class="name-row">
                    <div class="form-group">
                        <label for="first-name">First Name</label>
                        <input type="text" id="first-name" name="first-name" required>
                    </div>
                    <div class="form-group">
                        <label for="last-name">Last Name</label>
                        <input type="text" id="last-name" name="last-name" required>
                    </div>
                </div>
                <div class="form-group">
                    <label for="pronouns">Pronouns</label>
                    <input type="text" id="pronouns" name="pronouns" placeholder="e.g. she/her, he/him, they/them">
                </div>
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email" placeholder="email@example.com" required>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="••••••••" required minlength="8">
                </div>
                <div class="form-group">
                    <label for="confirm-password">Confirm Password</label>
                    <input type="password" id="confirm-password" name="confirm-password" placeholder="••••••••" required minlength="8">
                </div>
                <button type="submit" class="signup-btn">Sign Up</button>
            </form>
            <p class="login-prompt">Already have an account? <a href="login.html">Login</a></p>
        </div>
    </main>

    <!--FOOTER-->
    <div class="footer">
        <div class="media-icons">
            <div class="footer-logo">
                <img src="images/AnyBuddy LOGO.png" alt="AnyBuddy Logo" width=40px height=40px>
                <h3>AnyBuddy</h3>
            </div>
            <ul class="social-media-links">
                <li><a href="javascript:void(0)"><img src="images/facebook.png" alt="Facebook"></a></li>
                <li><a href="javascript:void(0)"><img src="images/twitter.png" alt="Twitter"></a></li>
                <li><a href="javascript:void(0)"><img src="images/instagram.png" alt="Instagram"></a></li>
            </ul>
        </div>
        <div class="platform-links">
            <h3>Platform</h3>
            <ul>
                <li><a href="marketplace.html">Marketplace</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="login.html">Login</a></li>
                <li><a href="signup.html">Sign up</a></li>
            </ul>
        </div>

        <div class="legal">
            <h3>Legal</h3>
            <ul>
                <li><a href="javascript:void(0)">Terms of Service</a></li>
                <li><a href="javascript:void(0)">Privacy Policy</a></li>
                <li><a href="javascript:void(0)">Cancellation and Refund</a></li>
            </ul>
        </div>

    </div>
    <script src="theme.js?v=30"></script>
    <script src="app_ajax.js?v=30"></script>
</body>
</html>
